<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wuffle — spike</title>
<style>
  :root { color-scheme: dark; --ink:#e8ecef; --dim:#8a929a; --bg:#15171a; --card:#1d2024;
    --line:#2f353b; --orange:#c8722e; --green:#4a9d5f; --blue:#4a7fb5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding: calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg); color:var(--ink); font:15px/1.4 "Barlow","Helvetica Neue",system-ui,sans-serif; }
  h1 { font:600 15px "Space Mono",ui-monospace,monospace; margin:0 0 2px; color:var(--ink); }
  .sub { color:var(--dim); font-size:12px; margin:0 0 12px; }
  /* header row: title + mode toggle inline */
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .top .brand { display:flex; align-items:baseline; gap:8px; min-width:0; }
  .top .brand h1 { margin:0; }
  .top .brand .sub { margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .modes { display:flex; gap:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex:none; }
  .modes button { padding:8px 13px; border:none; background:var(--card); color:var(--dim); font:600 13px system-ui; }
  .modes button.on { color:var(--orange); background:#241a12; }
  .modes button+button { border-left:1px solid var(--line); }

  /* the net IS the interface — reading + measure live in its dead corners */
  .net { position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:6px; margin-bottom:10px; }
  .net svg { width:100%; max-width:460px; height:auto; display:block; margin:0 auto; }
  /* caption in the dead top-right corner (mode toggle moved to the header) —
     avoids colliding with the S cardinal at bottom-centre */
  .net .cap { position:absolute; top:14px; right:16px; text-align:right; pointer-events:none;
    color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.06em; line-height:1.3; }
  .readout { position:absolute; top:14px; left:16px; pointer-events:none; }
  .readout .rd { display:flex; align-items:baseline; gap:6px; }
  .readout .rd b { font:700 34px "Space Mono",monospace; letter-spacing:-.02em; line-height:1.05; color:var(--ink); }
  .readout .rd b small { font-size:16px; color:var(--dim); font-weight:400; }
  .readout .rd .label { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.07em; }
  .readout .tilt { width:82px; height:4px; background:#0f1113; border-radius:2px; margin-top:8px; overflow:hidden; }
  .readout .tilt i { display:block; height:100%; background:var(--green); width:0; }
  /* measure floats at the screen corner (thumb-reachable), not over the net's
     data quadrant; the log scrolls under it */
  .fab { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom));
    right:calc(20px + env(safe-area-inset-right)); width:76px; height:76px; border:none; border-radius:50%;
    background:var(--orange); color:#161006; font:700 26px system-ui; box-shadow:0 6px 18px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; z-index:10; }
  .fab:active { filter:brightness(.88); transform:scale(.96); }
  .actions { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .actions .count { font:12px "Space Mono",monospace; color:var(--dim); }
  .actions button { padding:8px 13px; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:8px; font:600 13px system-ui; margin-left:6px; }
  .actions button#publish { border-color:var(--orange); color:var(--orange); }
  /* the net primitives (bearing emits classPrefix 'sn'). The primitive circle
     must be fill:none — an opaque fill paints OVER the grid + plotted data. The
     dark disk goes on the background rect. */
  .net .sn-background { fill:#0f1113; }
  .net .sn-primitive { fill:none; stroke:#5a626a; stroke-width:1.2; }
  .net .sn-grid { stroke:#39424a; stroke-width:.7; fill:none; }
  .net .sn-cardinal { fill:var(--dim); }
  .net .sn-plane { fill:none; stroke-width:2.2; }
  .net .sn-line, .net .sn-pole { stroke-width:1.5; }
  .log { font:12px "Space Mono",monospace; }
  .log ol { list-style:none; margin:0; padding:0; max-height:26vh; overflow:auto; }
  .log li { padding:7px 10px; border-left:3px solid var(--blue); background:var(--card); margin:3px 0;
    border-radius:0 6px 6px 0; display:flex; align-items:center; gap:8px; }
  .log li b { color:var(--ink); font-weight:700; }
  .log li span { color:var(--dim); flex:1; }
  .log li .del { flex:none; width:26px; height:26px; border:none; border-radius:6px; background:transparent;
    color:var(--dim); font:400 18px system-ui; line-height:1; }
  .log li .del:active { background:#2a1512; color:var(--red); }
  #msg { color:var(--dim); font-size:12px; margin-top:8px; min-height:16px; }
  .warn { color:var(--orange); }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><h1>wuffle</h1><span class="sub">compass · magnetic N</span></div>
  <div class="modes">
    <button id="mPlane" class="on">plane</button>
    <button id="mLine">line</button>
  </div>
</div>

<div class="net" id="net">
  <div id="netHost"></div>
  <div class="readout">
    <div class="rd"><b id="v1">—</b><span class="label" id="l1">dip dir</span></div>
    <div class="rd"><b id="v2">—</b><span class="label" id="l2">dip</span></div>
    <div class="tilt"><i id="lvl"></i></div>
  </div>
  <button class="fab" id="measure" aria-label="measure">◎</button>
  <div class="cap">Schmidt<br>lower hemi</div>
</div>

<div class="actions">
  <span class="count" id="count">0 measurements</span>
  <span><button id="clear">clear</button><button id="publish">publish →</button></span>
</div>

<div class="log">
  <ol id="list"></ol>
</div>
<div id="msg"></div>

<script type="module">
import { compass, Stereonet, conversions, curves } from './bearing.js';
import { shell } from './lead-acid.js';

const $ = id => document.getElementById(id);
let mode = 'plane';          // 'plane' | 'line'
let cur = null;              // last computed reading
let haveOrientation = false;
const log = [];

// keep the screen lit in the field (dogfoods shell.keepAwake)
if (shell.present) shell.keepAwake(true);

// the Schmidt net (equal-area is the structural-geology convention; the name
// puns on Wulff but orientation data belongs on an equal-area net)
const sn = new Stereonet({ projection: 'equal-area', size: 340, classPrefix: 'sn' });
const svg = sn.element();
$('netHost').appendChild(svg);
sn.render();

const OR = { stroke: '#c8722e', fill: '#c8722e' };   // measured plane
const BL = { stroke: '#4a7fb5', fill: '#4a7fb5' };   // measured line

// SMOOTHNESS: sn.render() re-projects the whole graticule + every measured item
// each call — fine when data changes (measure/clear), far too heavy at 60 Hz.
// The moving live-preview rides a SEPARATE overlay (one <path> + one dot) that
// we update per frame WITHOUT any sn.render() — bearing's render only runs when
// the static picture actually changes. The overlay survives render() (it updates
// specific elements, never wipes the SVG).
const NS = 'http://www.w3.org/2000/svg';
const livePath = document.createElementNS(NS, 'path');
livePath.setAttribute('fill', 'none'); livePath.setAttribute('stroke', '#7a828a');
livePath.setAttribute('stroke-width', '2'); livePath.setAttribute('stroke-dasharray', '5 4');
const liveDot = document.createElementNS(NS, 'circle');
liveDot.setAttribute('fill', '#7a828a'); liveDot.setAttribute('r', '0');
svg.appendChild(livePath); svg.appendChild(liveDot);

// static layer: only redrawn when the measurement set changes
function drawStatic() {
  sn.clear();
  for (const m of log) {
    if (m.mode === 'plane') sn.plane(m.d1, m.d2, OR);
    else sn.line(m.d1, m.d2, BL);
  }
  sn.render();
  svg.appendChild(livePath); svg.appendChild(liveDot);   // keep overlay on top
}

// live preview: reuse bearing's exact projection (planeToDcos + greatCircle +
// _projectCurve) so the ghost matches how a measured plane will land.
function liveTrace() {
  if (!cur) { livePath.setAttribute('d', ''); liveDot.setAttribute('r', '0'); return; }
  if (mode === 'plane') {
    const pole = conversions.planeToDcos(fmt(cur.d1), cur.d2);
    let d = '';
    for (const seg of sn._projectCurve(curves.greatCircle(pole, 180))) {
      if (seg.length > 1) d += 'M' + seg.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');
    }
    livePath.setAttribute('d', d); liveDot.setAttribute('r', '0');
  } else {
    const p = sn.projectLine(fmt(cur.d1), cur.d2);
    liveDot.setAttribute('cx', p.x); liveDot.setAttribute('cy', p.y); liveDot.setAttribute('r', '5');
    livePath.setAttribute('d', '');
  }
}
let raf = 0;
function requestLive() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; liveTrace(); }); }

function fmt(n) { return (Math.round(n) % 360 + 360) % 360; }
function setMode(m) {
  mode = m;
  $('mPlane').classList.toggle('on', m === 'plane');
  $('mLine').classList.toggle('on', m === 'line');
  $('l1').textContent = m === 'plane' ? 'dip dir' : 'trend';
  $('l2').textContent = m === 'plane' ? 'dip' : 'plunge';
  requestLive();
}
$('mPlane').onclick = () => setMode('plane');
$('mLine').onclick = () => setMode('line');

function onOrient(e) {
  if (e.alpha == null) return;
  haveOrientation = true;
  const a = e.alpha, b = e.beta, g = e.gamma;
  const [d1, d2] = mode === 'plane'
    ? compass.planeFromDeviceOrientation(a, b, g)
    : compass.lineFromDeviceOrientation(a, b, g);
  cur = { d1, d2, a, b, g };
  $('v1').innerHTML = fmt(d1) + '<small>°</small>';
  $('v2').innerHTML = Math.round(d2) + '<small>°</small>';
  $('lvl').style.width = Math.min(100, (d2 / 90) * 100) + '%';
  requestLive();
}
// absolute frame carries a compass-referenced alpha (Android); fall back.
window.addEventListener('deviceorientationabsolute', onOrient);
window.addEventListener('deviceorientation', (e) => { if (!haveOrientation) onOrient(e); });

function updateCount() {
  $('count').textContent = log.length + ' measurement' + (log.length === 1 ? '' : 's');
}
// rebuild the log list from the array (newest first); each row deletes on tap-×
function renderLog() {
  const list = $('list'); list.innerHTML = '';
  for (let k = log.length - 1; k >= 0; k--) {
    const m = log[k];
    const li = document.createElement('li');
    const label = m.mode === 'plane'
      ? `<b>${String(m.d1).padStart(3, '0')}/${String(m.d2).padStart(2, '0')}</b><span>plane · strike ${String(m.strike).padStart(3, '0')}</span>`
      : `<b>${String(m.d1).padStart(3, '0')}→${String(m.d2).padStart(2, '0')}</b><span>line</span>`;
    li.innerHTML = label + '<button class="del" aria-label="delete measurement">×</button>';
    li.querySelector('.del').onclick = () => {
      log.splice(k, 1); renderLog(); updateCount(); drawStatic();
      if (navigator.vibrate) navigator.vibrate(10);
    };
    list.appendChild(li);
  }
}

function record(d1, d2, m) {
  log.push({ i: log.length + 1, mode: m, d1: fmt(d1), d2: Math.round(d2),
    strike: m === 'plane' ? (fmt(d1) + 270) % 360 : null, ts: new Date().toISOString() });
  renderLog(); updateCount(); drawStatic();
}

$('measure').onclick = () => {
  if (!cur) { msg('no orientation yet — tilt the phone', true); return; }
  record(cur.d1, cur.d2, mode);
  if (navigator.vibrate) navigator.vibrate(15);
  msg('measured ' + (mode === 'plane' ? fmt(cur.d1) + '/' + Math.round(cur.d2) : fmt(cur.d1) + '→' + Math.round(cur.d2)));
};

$('clear').onclick = () => { log.length = 0; renderLog(); updateCount(); msg(''); drawStatic(); };

$('publish').onclick = async () => {
  if (!log.length) { msg('nothing to publish', true); return; }
  const rows = ['type,dip_dir_or_trend,dip_or_plunge,strike,timestamp'];
  for (const m of log) rows.push(`${m.mode},${m.d1},${m.d2},${m.strike ?? ''},${m.ts}`);
  const csv = new TextEncoder().encode(rows.join('\n') + '\n');
  if (!shell.present) { msg('not in lead-acid — CSV built (' + csv.length + ' B), no shell to publish', true); return; }
  try {
    const res = await shell.publish('wuffle-log.csv', csv, { collection: 'Downloads', mime: 'text/csv' });
    msg('published ' + log.length + ' → Downloads/wuffle-log.csv');
    console.log('[wuffle] published', res.uri);
  } catch (e) { msg('publish failed: ' + e, true); }
};

function msg(t, warn) { const m = $('msg'); m.textContent = t; m.className = warn ? 'warn' : ''; }

setMode('plane');
msg(shell.present ? 'lead-acid ready · lay the phone on a surface to measure' : 'desktop — no device orientation');
console.log('[wuffle] present=' + shell.present);

// debug hook (spike): plot without physical tilt
window.__wuffle = { plot: (d1, d2, m) => record(d1, d2, m) };
</script>
</body>
</html>
