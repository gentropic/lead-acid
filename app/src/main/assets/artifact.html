<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lead-acid spike 0</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));
    background: #17191c; color: #d8dce0;
    font: 14px/1.45 "Space Mono", ui-monospace, monospace;
  }
  h1 { font-size: 16px; margin: 4px 0 2px; color: #e8ecef; }
  .sub { color: #7a828a; font-size: 12px; margin: 0 0 12px; }
  .test { padding: 7px 10px; margin: 4px 0; border-left: 3px solid #3a3f45; background: #1d2024; }
  .test b { display: inline-block; min-width: 52px; }
  .pass { border-left-color: #4a9d5f; } .pass b { color: #6fc586; }
  .fail { border-left-color: #c25450; } .fail b { color: #e07a76; }
  .info { border-left-color: #4a7fb5; } .info b { color: #7aa8d8; }
  .detail { color: #8a929a; font-size: 12px; word-break: break-all; }
  #verdict { margin: 14px 0; padding: 10px 12px; font-size: 15px; border: 1px solid #3a3f45; }
  #verdict.ok { border-color: #4a9d5f; color: #6fc586; }
  #verdict.bad { border-color: #c25450; color: #e07a76; }
  .env { color: #666d75; font-size: 11px; margin-top: 16px; word-break: break-all; }
</style>
</head>
<body>
<h1>lead-acid — spike 0</h1>
<p class="sub">ranged fetch through shouldInterceptRequest, off mmap</p>
<div id="out"></div>
<div id="verdict">running…</div>

<h1 style="margin-top:22px">SAF random-access probe</h1>
<p class="sub">pick a big pattern file (byte[i] = i mod 251) from Downloads — times Blob.slice at rising offsets</p>
<input type="file" id="pick" style="margin:6px 0 10px">
<div id="saf"></div>

<div class="env" id="env"></div>

<script>
const SIZE = 8 * 1024 * 1024;
const out = document.getElementById('out');
const results = [];

function report(kind, name, detail) {
  results.push(kind);
  const d = document.createElement('div');
  d.className = 'test ' + kind;
  d.innerHTML = '<b>' + kind.toUpperCase() + '</b> ' + name +
    (detail ? '<div class="detail">' + detail + '</div>' : '');
  out.appendChild(d);
  console.log('[spike] ' + kind.toUpperCase() + ' | ' + name + (detail ? ' | ' + detail : ''));
}

// byte[i] = i mod 251
function checkPattern(bytes, offset) {
  for (let i = 0; i < bytes.length; i++) {
    if (bytes[i] !== (offset + i) % 251) return 'byte ' + i + ': got ' + bytes[i] + ', want ' + ((offset + i) % 251);
  }
  return null;
}

// No cache-busting: same URL, many ranges — micro's real access pattern.
// Responses are Cache-Control: no-store, which keeps the WebView HTTP cache
// (and its range-over-cached-entry machinery) out of the path entirely.
async function ranged(start, endIncl) {
  const spec = (start === null ? '' : start) + '-' + (endIncl === null ? '' : endIncl);
  return fetch('/native/fs/spike0.bin', { headers: { 'Range': 'bytes=' + spec } });
}

async function run() {
  // 1. full GET
  try {
    const r = await fetch('/native/fs/spike0.bin');
    const buf = new Uint8Array(await r.arrayBuffer());
    const err = buf.length === SIZE ? (checkPattern(buf.subarray(0, 4096), 0) ||
      checkPattern(buf.subarray(SIZE - 256), SIZE - 256)) : ('length ' + buf.length);
    if (r.status === 200 && !err) report('pass', 'full GET — 200, 8 MiB, pattern ok');
    else report('fail', 'full GET', 'status ' + r.status + ' ' + (err || ''));
  } catch (e) { report('fail', 'full GET', String(e)); }

  // 2. THE test — bytes=0-1023 → 206 + correct 1024 bytes
  try {
    const r = await ranged(0, 1023);
    const buf = new Uint8Array(await r.arrayBuffer());
    const cr = r.headers.get('Content-Range');
    const err = buf.length !== 1024 ? ('length ' + buf.length) : checkPattern(buf, 0);
    if (r.status === 206 && !err) report('pass', 'Range 0–1023 — 206, 1024 bytes, pattern ok', 'Content-Range: ' + cr);
    else report('fail', 'Range 0–1023', 'status ' + r.status + ', len ' + buf.length + ', ' + (err || '') + ', Content-Range: ' + cr);
  } catch (e) { report('fail', 'Range 0–1023', String(e)); }

  // 3. mid-file range
  try {
    const r = await ranged(1048576, 1049599);
    const buf = new Uint8Array(await r.arrayBuffer());
    const err = buf.length !== 1024 ? ('length ' + buf.length) : checkPattern(buf, 1048576);
    if (r.status === 206 && !err) report('pass', 'Range 1 MiB mark — 206, pattern ok');
    else report('fail', 'Range 1 MiB mark', 'status ' + r.status + ' ' + (err || ''));
  } catch (e) { report('fail', 'Range 1 MiB mark', String(e)); }

  // 4. suffix range: last 1024 bytes
  try {
    const r = await ranged(null, 1024);
    const buf = new Uint8Array(await r.arrayBuffer());
    const err = buf.length !== 1024 ? ('length ' + buf.length) : checkPattern(buf, SIZE - 1024);
    if (r.status === 206 && !err) report('pass', 'suffix Range (last 1024) — 206, pattern ok');
    else report('fail', 'suffix Range', 'status ' + r.status + ' ' + (err || ''));
  } catch (e) { report('fail', 'suffix Range', String(e)); }

  // 5. open-ended range
  try {
    const r = await ranged(SIZE - 608, null);
    const buf = new Uint8Array(await r.arrayBuffer());
    const err = buf.length !== 608 ? ('length ' + buf.length) : checkPattern(buf, SIZE - 608);
    if (r.status === 206 && !err) report('pass', 'open-ended Range — 206, 608 bytes');
    else report('fail', 'open-ended Range', 'status ' + r.status + ' ' + (err || ''));
  } catch (e) { report('fail', 'open-ended Range', String(e)); }

  // 6. past EOF → 416
  try {
    const r = await ranged(9000000, null);
    if (r.status === 416) report('pass', 'past-EOF Range — 416', 'Content-Range: ' + r.headers.get('Content-Range'));
    else report('fail', 'past-EOF Range', 'status ' + r.status + ' (want 416)');
  } catch (e) { report('fail', 'past-EOF Range', String(e)); }

  // 7. throughput: 32 × 256 KiB ranged reads (8 MiB total)
  try {
    const t0 = performance.now();
    for (let i = 0; i < 32; i++) {
      const start = i * 256 * 1024;
      const r = await ranged(start, start + 256 * 1024 - 1);
      await r.arrayBuffer();
    }
    const ms = performance.now() - t0;
    report('info', 'throughput: 8 MiB in 32 ranged reads', (8 / (ms / 1000)).toFixed(1) + ' MB/s (' + ms.toFixed(0) + ' ms)');
  } catch (e) { report('fail', 'throughput', String(e)); }

  // 8. custom request header visibility
  try {
    const r = await fetch('/native/fs/echo', { headers: { 'X-Spike': '42' } });
    const j = await r.json();
    const seen = Object.keys(j.headers).find(k => k.toLowerCase() === 'x-spike');
    if (seen) report('pass', 'custom request header crosses the bridge', 'X-Spike seen by Kotlin');
    else report('fail', 'custom request header', 'X-Spike NOT in ' + Object.keys(j.headers).join(', '));
  } catch (e) { report('fail', 'header echo', String(e)); }

  // 9. POST body probe — expected absent (crbug 155250); recorded, not judged
  try {
    const r = await fetch('/native/fs/echo', { method: 'POST', body: 'hello-body',
      headers: { 'Content-Type': 'text/plain' } });
    const j = await r.json();
    report('info', 'POST through the bridge — method=' + j.method,
      'request bodies are not observable via shouldInterceptRequest (known Chromium limit); ' +
      'headers seen: ' + Object.keys(j.headers).join(', '));
  } catch (e) { report('fail', 'POST probe', String(e)); }

  // 10. unknown route → 404
  try {
    const r = await fetch('/native/nope/x');
    if (r.status === 404) report('pass', 'unknown plugin — 404');
    else report('fail', 'unknown plugin', 'status ' + r.status);
  } catch (e) { report('fail', 'unknown plugin', String(e)); }

  // 11. §7c shell controls: keepawake route + shell/info
  try {
    const info = await (await fetch('/native/shell/info')).json();
    report(info.present ? 'pass' : 'fail', 'shell/info — present=' + info.present, 'version ' + info.version);
  } catch (e) { report('fail', 'shell/info', String(e)); }
  try {
    const r = await fetch('/native/shell/keepawake?on=true', { method: 'POST' });
    const j = await r.json();
    report(j.ok ? 'pass' : 'fail', 'shell/keepawake on', 'FLAG_KEEP_SCREEN_ON set — screen stays lit');
  } catch (e) { report('fail', 'shell/keepawake', String(e)); }

  const fails = results.filter(r => r === 'fail').length;
  const v = document.getElementById('verdict');
  if (fails === 0) { v.className = 'ok'; v.textContent = 'SPIKE 0 PASSES — the thesis holds. ' + results.filter(r => r === 'pass').length + ' pass, 0 fail.'; }
  else { v.className = 'bad'; v.textContent = 'SPIKE 0 FAILS — ' + fails + ' failing. See above; fall back to SPEC §4.3.'; }

  // environment (SPEC Q-1)
  document.getElementById('env').textContent =
    'webgl2: ' + (!!document.createElement('canvas').getContext('webgl2')) +
    ' · webgpu: ' + ('gpu' in navigator) +
    ' · ' + navigator.userAgent;
}
run();

// --- SAF random-access probe -------------------------------------------
// The /native/fs-vs-Blob fork: is Blob.slice(off, off+k) on a SAF-backed
// File O(1) in the offset (true random access) or O(off) (streams to it)?
// Pattern file byte[i] = i mod 251 lets us verify AND time each read.
const safOut = document.getElementById('saf');
function safReport(kind, name, detail) {
  const d = document.createElement('div');
  d.className = 'test ' + kind;
  d.innerHTML = '<b>' + kind.toUpperCase() + '</b> ' + name +
    (detail ? '<div class="detail">' + detail + '</div>' : '');
  safOut.appendChild(d);
  console.log('[saf] ' + kind.toUpperCase() + ' | ' + name + (detail ? ' | ' + detail : ''));
}
async function sliceBytes(file, start, len) {
  return new Uint8Array(await file.slice(start, start + len).arrayBuffer());
}
function patternErr(buf, off) {
  for (let i = 0; i < buf.length; i++)
    if (buf[i] !== (off + i) % 251) return 'byte ' + i + ' got ' + buf[i] + ' want ' + ((off + i) % 251);
  return null;
}
document.getElementById('pick').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  safOut.innerHTML = '';
  safReport('info', file.name, (file.size / 1048576).toFixed(1) + ' MiB');
  const K = 64 * 1024;
  const size = file.size;
  // offsets from front to back; if slicing is O(offset) the far reads balloon
  const marks = [0, 0.25, 0.5, 0.75, 0.999].map(f => Math.min(size - K, Math.floor(size * f)));
  const times = [];
  for (const off of marks) {
    const reps = 5; let best = Infinity, bad = null;
    for (let r = 0; r < reps; r++) {
      const t = performance.now();
      const buf = await sliceBytes(file, off, K);
      const dt = performance.now() - t;
      if (dt < best) best = dt;
      bad = bad || patternErr(buf, off);
    }
    times.push(best);
    safReport(bad ? 'fail' : 'pass',
      'slice @ ' + (off / 1048576).toFixed(0) + ' MiB',
      (bad ? bad : 'bytes ok') + ' · ' + best.toFixed(2) + ' ms/64KiB (best of ' + reps + ')');
  }
  // scattered random reads → effective random-access throughput
  const t0 = performance.now();
  let rbad = null;
  for (let i = 0; i < 64; i++) {
    const off = Math.min(size - K, Math.floor((i * 2654435761 % 1000) / 1000 * size));
    rbad = rbad || patternErr(await sliceBytes(file, off, K), off);
  }
  const rms = performance.now() - t0;
  safReport(rbad ? 'fail' : 'info', '64 scattered 64-KiB reads',
    (rbad ? rbad : (64 * K / 1048576 / (rms / 1000)).toFixed(1) + ' MB/s · ' + rms.toFixed(0) + ' ms'));
  // verdict: does cost scale with offset?
  const ratio = times[times.length - 1] / Math.max(0.01, times[0]);
  safReport(ratio < 4 ? 'pass' : 'fail', 'random-access verdict',
    'far/near slice time ratio = ' + ratio.toFixed(1) + 'x — ' +
    (ratio < 4 ? 'O(1): SAF Blob.slice is real random access; /native/fs is an optimization'
               : 'O(offset): SAF streams to the offset; /native/fs earns its place for big files'));

  // --- head to head: mmap-over-SAF-fd (/native/fs) on the SAME picked file ---
  // The shell registered the SAF pick as an fs token; find the newest one.
  let token = null;
  try {
    const reg = await (await fetch('/native/fs/list')).json();
    const match = reg.filter(r => r.size === size);
    token = (match[match.length - 1] || reg[reg.length - 1] || {}).token;
  } catch (e) { safReport('fail', '/native/fs/list', String(e)); }
  if (!token) { safReport('info', 'mmap comparison skipped', 'no fs token for this file'); return; }

  async function fsSlice(off, len) {
    const r = await fetch('/native/fs/' + encodeURIComponent(token),
      { headers: { Range: 'bytes=' + off + '-' + (off + len - 1) } });
    return { status: r.status, buf: new Uint8Array(await r.arrayBuffer()) };
  }
  // same offsets, same reps
  const fsTimes = [];
  for (const off of marks) {
    let best = Infinity, bad = null;
    for (let r = 0; r < 5; r++) {
      const t = performance.now();
      const { status, buf } = await fsSlice(off, K);
      const dt = performance.now() - t;
      if (dt < best) best = dt;
      bad = bad || (status !== 206 ? 'status ' + status : patternErr(buf, off));
    }
    fsTimes.push(best);
    safReport(bad ? 'fail' : 'pass', 'fs mmap @ ' + (off / 1048576).toFixed(0) + ' MiB',
      (bad ? bad : 'bytes ok') + ' · ' + best.toFixed(2) + ' ms/64KiB');
  }
  // same 64 scattered reads, over /native/fs
  const seedR = (i) => Math.min(size - K, Math.floor((i * 2654435761 % 1000) / 1000 * size));
  const ft0 = performance.now();
  let fbad = null;
  for (let i = 0; i < 64; i++) {
    const { status, buf } = await fsSlice(seedR(i), K);
    fbad = fbad || (status !== 206 ? 'status ' + status : patternErr(buf, seedR(i)));
  }
  const frms = performance.now() - ft0;
  safReport(fbad ? 'fail' : 'info', 'fs mmap: 64 scattered reads',
    (fbad ? fbad : (64 * K / 1048576 / (frms / 1000)).toFixed(1) + ' MB/s · ' + frms.toFixed(0) + ' ms'));

  const blobMed = times.slice().sort((a, b) => a - b)[2];
  const fsMed = fsTimes.slice().sort((a, b) => a - b)[2];
  const speedup = blobMed / Math.max(0.01, fsMed);
  safReport('info', 'VERDICT: mmap-over-SAF-fd vs Blob.slice',
    'median per-64KiB — Blob.slice ' + blobMed.toFixed(1) + ' ms vs fs-mmap ' + fsMed.toFixed(1) +
    ' ms = ' + speedup.toFixed(1) + 'x. ' +
    (speedup > 3 ? '/native/fs is worth building for big-file streaming.'
                 : 'mmap barely beats Blob.slice on SAF fds — /native/fs is NOT worth the integration.'));

  // --- lead-acid.js: the shell module + @gcu/vfs fs-adapter (SPEC §4.5) ---
  try {
    const { shell } = await import('./lead-acid.js');
    safReport(shell.present ? 'pass' : 'fail', 'lead-acid.js shell.present',
      shell.present ? 'version ' + await shell.version() : '__leadacid interface missing');

    // fileSource: the duck-typed source lamina/micro consume (readRange fast path)
    const src = shell.fileSource(token, size);
    const b = await src.readRange(384 * 1048576, 64 * 1024);
    safReport(patternErr(b, 384 * 1048576) ? 'fail' : 'pass', 'shell.fileSource.readRange',
      'mmap path via the shell module, bytes ok · rangeReadable=' + src.rangeReadable);

    // fsBackend: a @gcu/vfs Backend over /native/fs. Feed a minimal Backend base
    // so we don't bundle vfs — the adapter subclasses whatever we pass.
    class FakeBackend { get rangeReadable() { return false; } }
    const Be = shell.fsBackend(FakeBackend);
    const be = new Be();
    const st = await be.stat('/' + token);
    const vr = await be.readRange('/' + token, 511 * 1048576, 64 * 1024);
    const ok = be.rangeReadable && st.size === size && !patternErr(vr, 511 * 1048576);
    safReport(ok ? 'pass' : 'fail', 'shell.fsBackend (@gcu/vfs adapter)',
      'rangeReadable=' + be.rangeReadable + ' · stat.size=' + st.size + ' · readRange bytes ' +
      (patternErr(vr, 511 * 1048576) ? 'BAD' : 'ok') +
      ' — non-Sealed artifacts get the mmap path for free');
  } catch (e) { safReport('fail', 'lead-acid.js adapter', String(e)); }
});
</script>
</body>
</html>
